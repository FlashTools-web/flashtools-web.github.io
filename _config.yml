# Konfiguracja Jekyll dla GitHub Pages
title: FlashTools
url: "https://flashtools-web.github.io"
lang: pl

# Kod z Google Search Console (metoda "Tag HTML"): usuń "#" na początku linii poniżej i wklej wartość content="..."
# google_site_verification: "TU_WKLEJ_KOD"

# Mapa strony (sitemap.xml) generowana automatycznie przez GitHub Pages
plugins:
  - jekyll-sitemap

# Pliki, których Jekyll nie publikuje
exclude:
  - README.md
  - tools/
  - podglad.bat
  - _preview/
