<!-- 5. DEV TOOLS -->
<section id="view-dev" class="tool-view">
    <div class="tool-header"><h1>💻 JSON, Base64, MD5 i SHA-256</h1><p>Formatowanie JSON, Base64 i Hashing kryptograficzny.</p></div>
    <div class="panel">
        <div class="form-group"><label>Input string / JSON</label><textarea id="d_in" oninput="procDev()"></textarea></div>
        <div class="flex-row">
            <div class="flex-1 form-group">
                <label>MD5 Hash</label>
                <div class="input-group"><input type="text" id="d_md5" readonly><button class="btn-secondary copy-btn" onclick="copyTextToClipboard(document.getElementById('d_md5').value, this)">Kopiuj</button></div>
            </div>
            <div class="flex-1 form-group">
                <label>SHA-256 Hash</label>
                <div class="input-group"><input type="text" id="d_sha" readonly><button class="btn-secondary copy-btn" onclick="copyTextToClipboard(document.getElementById('d_sha').value, this)">Kopiuj</button></div>
            </div>
        </div>
        <div class="flex-row">
            <div class="flex-1 form-group">
                <label>Base64 Encode (UTF-8 safe)</label>
                <div class="input-group"><input type="text" id="d_b64e" readonly><button class="btn-secondary copy-btn" onclick="copyTextToClipboard(document.getElementById('d_b64e').value, this)">Kopiuj</button></div>
            </div>
            <div class="flex-1 form-group">
                <label>Base64 Decode</label>
                <div class="input-group"><input type="text" id="d_b64d" readonly><button class="btn-secondary copy-btn" onclick="copyTextToClipboard(document.getElementById('d_b64d').value, this)">Kopiuj</button></div>
            </div>
        </div>
        <div class="form-group mt-1">
            <div class="flex-row row-between json-header">
                <label class="label-inline">Sformatowany JSON (Output)</label>
                <div class="btn-group">
                    <button class="btn-secondary btn-sm" onclick="procDev(false)">Beautify</button>
                    <button class="btn-secondary btn-sm" onclick="procDev(true)">Minify</button>
                    <button class="btn-primary btn-sm" onclick="copyTextToClipboard(document.getElementById('d_json').value, this)">Kopiuj JSON</button>
                </div>
            </div>
            <textarea id="d_json" readonly></textarea>
        </div>
    </div>
</section>
