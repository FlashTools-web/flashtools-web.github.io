<!-- 8. PRODUKTYWNOŚĆ -->
<section id="view-prod" class="tool-view">
    <div class="tool-header"><h1>⏱️ Timer Pomodoro i notatki</h1><p>Timer Pomodoro i Szybkie Notatki z Auto-zapisem.</p></div>
    <div class="flex-row">
        <div class="flex-1 panel panel-centered">
            <h3>Pomodoro</h3>
            <div id="po_t">25:00</div>
            <div class="flex-row row-center">
                <button id="po_b" class="btn-primary pomo-btn" onclick="togglePomo()">START</button>
                <button class="btn-secondary" onclick="resetPomo()">RESET</button>
            </div>
        </div>
        <div class="flex-1 panel">
            <h3>Szybkie Notatki</h3>
            <textarea id="po_n" placeholder="Pisz tutaj... Zapisuje się automatycznie." oninput="saveNote()"></textarea>
            <div class="flex-row row-between notes-footer">
                <span id="po_st">Zapisano!</span>
                <button class="btn-secondary btn-sm btn-danger" onclick="if(confirm('Wyczyścić notatnik?')){document.getElementById('po_n').value=''; saveNote();}">Wyczyść</button>
            </div>
        </div>
    </div>
</section>
