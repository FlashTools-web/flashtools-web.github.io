<!-- 4. PDF -->
<section id="view-pdf" class="tool-view">
    <div class="tool-header"><h1>📄 Narzędzia PDF online</h1><p>Odblokowuj, łącz, wyodrębniaj i nakładaj znaki wodne. Działa offline w RAM.</p></div>
    <div class="panel">
        <div class="tabs" id="pdfTabs">
            <div class="tab active" data-target="pdf-merge" onclick="setPdfMode('merge')">🔗 Połącz PDF</div>
            <div class="tab" data-target="pdf-extract" onclick="setPdfMode('extract')">✂️ Wydobądź Strony</div>
            <div class="tab" data-target="pdf-watermark" onclick="setPdfMode('watermark')">©️ Znak Wodny</div>
            <div class="tab" data-target="pdf-unlock" onclick="setPdfMode('unlock')">🔓 Odblokuj</div>
            <div class="tab" data-target="pdf-img" onclick="setPdfMode('img2pdf')">🖼️ Zdjęcia do PDF</div>
        </div>

        <div id="pdfDrop" class="drop-zone" onclick="document.getElementById('pdfIn').click()">📂 Kliknij lub upuść pliki tutaj</div>
        <input type="file" id="pdfIn" class="is-hidden" multiple accept=".pdf" onchange="handlePdf(this.files)">
        <div id="pdfList"></div>

        <div id="pdfOpt_extract" class="form-group pdf-option is-hidden"><label>Numery stron (np. 1, 3, 5-7):</label><input type="text" id="pdf_extr_val" value="1"></div>
        <div id="pdfOpt_unlock" class="form-group pdf-option is-hidden"><label>Hasło do pliku (do zdjęcia blokady):</label><input type="password" id="pdf_pass_val"></div>

        <div id="pdfOpt_watermark" class="flex-row pdf-option is-hidden">
            <div class="form-group flex-1"><label>Tekst znaku</label><input type="text" id="pdf_wm_txt" value="POUFNE"></div>
            <div class="form-group flex-1"><label>Rozmiar fontu</label><input type="number" id="pdf_wm_sz" value="60"></div>
            <div class="form-group flex-1"><label>Kolor (HEX)</label><input type="color" id="pdf_wm_col" class="color-input" value="#ff0000"></div>
        </div>

        <button id="pdfBtn" class="btn-primary btn-success is-hidden" onclick="processPdf()">⚙️ Przetwarzaj Pliki</button>
    </div>
</section>
