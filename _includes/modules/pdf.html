<!-- 4. PDF -->
<section id="view-pdf" class="tool-view">
    <div class="tool-header"><h2>📄 Narzędzia PDF</h2><p>Odblokowuj, łącz, wyodrębniaj i nakładaj znaki wodne. Działa offline w RAM.</p></div>
    <div class="panel">
        <div class="tabs" id="pdfTabs">
            <div class="tab active" data-target="pdf-merge" onclick="setPdfMode('merge')">🔗 Połącz PDF</div>
            <div class="tab" data-target="pdf-extract" onclick="setPdfMode('extract')">✂️ Wydobądź Strony</div>
            <div class="tab" data-target="pdf-watermark" onclick="setPdfMode('watermark')">©️ Znak Wodny</div>
            <div class="tab" data-target="pdf-unlock" onclick="setPdfMode('unlock')">🔓 Odblokuj</div>
            <div class="tab" data-target="pdf-img" onclick="setPdfMode('img2pdf')">🖼️ Zdjęcia do PDF</div>
        </div>
        
        <div id="pdfDrop" class="drop-zone" onclick="document.getElementById('pdfIn').click()">📂 Kliknij lub upuść pliki tutaj</div>
        <input type="file" id="pdfIn" multiple accept=".pdf" style="display:none;" onchange="handlePdf(this.files)">
        <div id="pdfList" style="margin-top:1.5rem;"></div>
        
        <div id="pdfOpt_extract" style="display:none; margin-top:1.5rem;" class="form-group"><label>Numery stron (np. 1, 3, 5):</label><input type="text" id="pdf_extr_val" value="1"></div>
        <div id="pdfOpt_unlock" style="display:none; margin-top:1.5rem;" class="form-group"><label>Hasło do pliku (do zdjęcia blokady):</label><input type="password" id="pdf_pass_val"></div>
        
        <div id="pdfOpt_watermark" style="display:none; margin-top:1.5rem;" class="flex-row">
            <div class="form-group flex-1"><label>Tekst znaku</label><input type="text" id="pdf_wm_txt" value="POUFNE"></div>
            <div class="form-group flex-1"><label>Rozmiar fontu</label><input type="number" id="pdf_wm_sz" value="60"></div>
            <div class="form-group flex-1"><label>Kolor (HEX)</label><input type="color" id="pdf_wm_col" value="#ff0000" style="height:45px; border:none; padding:0;"></div>
        </div>

        <button id="pdfBtn" class="btn-primary" style="display:none; margin-top:1.5rem; background:var(--success);" onclick="processPdf()">⚙️ Przetwarzaj Pliki</button>
    </div>
</section>
