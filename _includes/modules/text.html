<!-- 3. TEKST -->
<section id="view-text" class="tool-view">
    <div class="tool-header"><h1>✍️ Licznik znaków i formatowanie tekstu</h1><p>Oczyszczanie tekstu, statystyki i podgląd na żywo.</p></div>
    <div class="panel">
        <div class="flex-row stats-bar">
            <div>Znaków: <span id="t_chr" class="stat-value">0</span></div>
            <div>Słów: <span id="t_wrd" class="stat-value">0</span></div>
            <div>Linii: <span id="t_lin" class="stat-value">0</span></div>
        </div>
        <div class="flex-row mb-15">
            <button class="btn-secondary flex-1" onclick="fmtTxt('UP')">UPPERCASE</button>
            <button class="btn-secondary flex-1" onclick="fmtTxt('LO')">lowercase</button>
            <button class="btn-secondary flex-1" onclick="fmtTxt('TI')">Title Case</button>
            <button class="btn-secondary flex-1" onclick="fmtTxt('CL')">Usuń puste spacje</button>
            <button class="btn-secondary btn-highlight flex-1" onclick="genLorem()">+ Lorem Ipsum</button>
        </div>
        <div class="flex-row">
            <textarea id="t_in" class="flex-1" placeholder="Wklej tekst lub kod Markdown..." oninput="parseTxt()"></textarea>
            <div id="t_out" class="flex-1">Podgląd HTML...</div>
        </div>
    </div>
</section>
