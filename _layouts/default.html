<!DOCTYPE html>
<html lang="{{ site.lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}{% unless page.title %} | All-in-One Tools{% endunless %}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">

    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%2309090b'/><path d='M58 10 L26 55 H47 L42 90 L74 44 H53 Z' fill='%2300d2ff'/></svg>">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <div class="app-container">
        {% include header.html %}

        <main id="app-root">
            {{ content }}
        </main>

        {% include footer.html %}
    </div>

    <!-- BIBLIOTEKI ZEWNĘTRZNE (lista w front matter strony) -->
    {% for lib in page.vendor_scripts %}<script src="{{ lib }}"></script>
    {% endfor %}
    <!-- LOGIKA JS -->
    <script src="assets/js/core.js"></script>
    {% for script in page.scripts %}<script src="assets/js/{{ script }}"></script>
    {% endfor %}
</body>
</html>
